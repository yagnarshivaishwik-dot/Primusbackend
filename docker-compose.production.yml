# =============================================================================
# Primus Platform — Production docker compose (blue/green, read-only, GHCR)
# =============================================================================
# Purpose:
#   Production runtime, distinct from the dev backend/docker-compose.yml.
#   Key differences from dev:
#     - image pulled from GHCR (no `build:` section)
#     - no --reload, no host bind-mount of source code
#     - read-only root filesystem with tmpfs for /tmp + /run
#     - Redis requires a password (BUG #INF-002), AOF persistence, daily save
#     - All services restart=unless-stopped, healthchecks, loki log driver
#     - Two backend services: backend-blue + backend-green for blue/green deploys
#
# Forensic audit references:
#   BUG #INF-001  Single backend container, no blue/green — fixed.
#   BUG #INF-002  Redis ran with no auth — fixed (--requirepass).
#   BUG #INF-003  Source bind-mounted in prod — removed.
#   BUG #INF-004  Logs went to /app/logs only — switched to loki driver.
#   BUG #INF-005  Writable container fs allowed in-place tampering — read_only.
#
# Required external setup:
#   - /etc/primus/primus.env (mode 0600, env vars below)
#   - Loki endpoint reachable at LOKI_URL (default http://loki:3100)
#   - The GHCR image must be pullable; on first run:
#       docker login ghcr.io -u <user> -p <pat>
#   - Nginx (host-mode or sibling service) must be configured per
#       backend/nginx/default.conf and /etc/nginx/conf.d/upstream-color.conf
#
# Required env (in /etc/primus/primus.env):
#   PRIMUS_IMAGE=ghcr.io/HSNTech/primus-backend:<sha>
#   DATABASE_URL=postgresql+psycopg2://...
#   REDIS_PASSWORD=...
#   JWT_SECRET=...
#   SECRET_KEY=...
#   APP_SECRET=...
#   LOKI_URL=http://loki:3100
# =============================================================================

version: "3.9"

x-loki-logging: &loki-logging
  driver: loki
  options:
    loki-url: "${LOKI_URL:-http://loki:3100}/loki/api/v1/push"
    loki-batch-size: "400"
    loki-retries: "5"
    loki-pipeline-stages: |
      - regex:
          expression: '^(?P<ts>\S+) (?P<level>\S+) (?P<msg>.*)$'

x-backend-common: &backend-common
  image: "${PRIMUS_IMAGE}"
  pull_policy: always
  env_file:
    - /etc/primus/primus.env
  environment:
    REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
    CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@redis:6379/1"
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
    - /run:size=16m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - NET_BIND_SERVICE
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  logging: *loki-logging
  ulimits:
    nofile:
      soft: 65535
      hard: 65535

services:
  # ----------- Redis ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: primus_redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging: *loki-logging
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  # ----------- Backend BLUE -------------------------------------------------
  backend-blue:
    <<: *backend-common
    container_name: primus_backend_blue
    hostname: backend-blue
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/livez"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ----------- Backend GREEN ------------------------------------------------
  backend-green:
    <<: *backend-common
    container_name: primus_backend_green
    hostname: backend-green
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/livez"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Default state: only blue runs. Green is brought up by the deploy script.
    profiles:
      - blue-green

  # ----------- Celery worker -------------------------------------------------
  celery-worker:
    <<: *backend-common
    container_name: primus_celery_worker
    command:
      [
        "celery",
        "-A", "app.celery_app",
        "worker",
        "--loglevel=info",
        "--queues=periodic,realtime,default",
        "--concurrency=4",
      ]
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports: []

  # ----------- Celery beat ---------------------------------------------------
  celery-beat:
    <<: *backend-common
    container_name: primus_celery_beat
    command:
      [
        "celery",
        "-A", "app.celery_app",
        "beat",
        "--loglevel=info",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat-schedule"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports: []

volumes:
  redis_data:
    driver: local

networks:
  default:
    name: primus_prod_network
    driver: bridge
