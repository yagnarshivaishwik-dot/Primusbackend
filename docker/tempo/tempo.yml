# =============================================================================
# Primus Tempo Configuration
# =============================================================================
# Purpose:
#   Single-binary Tempo, OTLP-only ingress, local storage. Wired into
#   Grafana as the Traces datasource so request_id / trace_id from the
#   FastAPI JSON middleware connects directly to a span tree.
#
# Forensic audit BUGs:
#   - BUG #F.6 (no distributed tracing backend was wired)
# =============================================================================

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 10s
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h        # 7 days

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

metrics_generator:
  registry:
    external_labels:
      source: tempo
      service: primus
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
