# =============================================================================
# Primus OpenTelemetry Collector Configuration
# =============================================================================
# Purpose:
#   Single OTLP endpoint for the FastAPI app + Celery workers + nginx OTel
#   module. Fans out:
#     - traces  -> Tempo (OTLP gRPC)
#     - metrics -> Prometheus (collector's own Prometheus exporter on :8889)
#     - logs    -> Loki (via loki/grafana-loki exporter)
#
# Forensic audit BUGs:
#   - BUG #F.6 (no central OTLP pipeline)
#   - BUG #F.6a (tail-based sampling missing -> high cost from health-checks)
# =============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Self-instrumentation
  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 30s
          static_configs:
            - targets: ["0.0.0.0:8888"]

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25

  # Strip noise from health/metric probes — they would otherwise burn quota.
  filter/healthchecks:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.target"] == "/livez"'
        - 'attributes["http.target"] == "/readyz"'
        - 'attributes["http.target"] == "/api/health"'
        - 'attributes["http.target"] == "/metrics"'

  # Tail-based sampling — keep all errors, sample 10% of normal traffic.
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 1000
      - name: payments
        type: string_attribute
        string_attribute:
          key: http.target
          values: ["/api/v1/payment/.*", "/api/payment/.*"]
          enabled_regex_matching: true
      - name: sample-rest
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

  resource:
    attributes:
      - key: deployment.environment
        value: prod
        action: upsert

exporters:
  # Traces -> Tempo
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Metrics -> Prometheus (scraped by Prom on :8889)
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    metric_expiration: 5m

  # Logs -> Loki
  loki:
    endpoint: http://loki:3100/loki/api/v1/push

  # Debug fallback
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/healthchecks, tail_sampling, batch, resource]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [loki]
  telemetry:
    logs:
      level: warn
    metrics:
      address: 0.0.0.0:8888
