# P2-hardening: run gitleaks on every PR + push to main.
#
# Catches accidentally-committed secrets BEFORE they hit a public branch
# and trigger a key-rotation incident (see SECURITY.md). Uses the repo-
# local .gitleaks.toml so the ruleset is reviewable and pinned alongside
# the code it protects.
name: secrets-scan

on:
  pull_request:
    branches:
      - main
      - "release/**"
  push:
    branches:
      - main
      - "release/**"
  # Weekly full-history scan to catch anything that slipped via force-push
  # before the workflow existed.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need the full history for the scheduled/main runs so we catch
          # secrets that may have entered via an old commit.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # No-license / open-source mode.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITLEAKS_CONFIG: .gitleaks.toml
          # Fail the job on any finding, so the PR is blocked.
          GITLEAKS_EXIT_CODE: "1"
