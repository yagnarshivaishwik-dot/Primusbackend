# =============================================================================
# Primus Platform — Continuous Integration Pipeline
# =============================================================================
# Purpose:
#   Runs full quality + security gate on every PR and push-to-main:
#     - Python backend: lint, type-check, security scans, tests + coverage
#     - 3 frontends: lint + build
#     - C# kiosk: restore/build/test on Windows
#     - Secret scanning (gitleaks + trufflehog)
#     - Container image scan (Trivy) + SBOM (syft, SPDX)
#     - Alembic migration sanity for all three chains (core/cafe/global)
#
# Forensic audit references:
#   BUG #CI-001  No CI gate before merges — addressed by this file.
#   BUG #CI-002  Hardcoded creds historically leaked — addressed by secrets-scan job.
#   BUG #CI-003  Image CVEs unmonitored — addressed by docker-build + trivy.
#   BUG #CI-004  Migration drift between chains undetected — addressed by migration-check.
#
# Required GitHub repo configuration:
#   - Secret CODECOV_TOKEN  (for coverage upload)
#   - Secret GITLEAKS_LICENSE (optional, only for org licence)
#   - Branch protection: require all jobs below to pass before merge to main.
# =============================================================================

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend: Python 3.11 (FastAPI + SQLAlchemy + Celery)
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (python)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check app

      - name: Mypy (type check)
        run: mypy app
        continue-on-error: false

      - name: Bandit (static security)
        run: bandit -r app -ll -ii -x app/tests,tests

      - name: Safety (known CVE policy)
        run: safety check --policy-file ../.safety-policy.yml || safety check --file requirements.txt --json

      - name: pip-audit (PyPI advisory scan)
        run: pip-audit --strict --requirement requirements.txt

      - name: Pytest with coverage gate (>= 60%)
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379/15
          JWT_SECRET: ci-test-secret-not-real
          SECRET_KEY: ci-test-secret-not-real
          APP_SECRET: ci-test-secret-not-real
        run: |
          pytest tests \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Frontend: Admin Console
  # ---------------------------------------------------------------------------
  frontend-admin:
    name: Frontend (admin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: primus-admin-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: primus-admin-main/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

  # ---------------------------------------------------------------------------
  # Frontend: SuperAdmin
  # ---------------------------------------------------------------------------
  frontend-superadmin:
    name: Frontend (superadmin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Primus-SuperAdmin-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Primus-SuperAdmin-main/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

  # ---------------------------------------------------------------------------
  # Frontend: Kiosk web bundle
  # ---------------------------------------------------------------------------
  frontend-kiosk:
    name: Frontend (kiosk)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ClutcHH-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ClutcHH-1/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

  # ---------------------------------------------------------------------------
  # C# Kiosk: Windows runner required
  # ---------------------------------------------------------------------------
  csharp-kiosk:
    name: C# Kiosk
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: "Primus C#"
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csharp-test-results
          path: "Primus C#/**/test-results.trx"

  # ---------------------------------------------------------------------------
  # Secrets scan — gitleaks (primary) + trufflehog (cross-check)
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@v3.82.13
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ---------------------------------------------------------------------------
  # Docker image build + Trivy CVE scan
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker build + Trivy
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image (local)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.production
          push: false
          load: true
          tags: primus-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: primus-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ---------------------------------------------------------------------------
  # Migration sanity check — all 3 alembic chains against ephemeral postgres
  # ---------------------------------------------------------------------------
  migration-check:
    name: Alembic migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: primus_user
          POSTGRES_PASSWORD: primus_pw
          POSTGRES_DB: primus_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U primus_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt alembic

      - name: Create auxiliary databases
        env:
          PGPASSWORD: primus_pw
        run: |
          psql -h localhost -U primus_user -d primus_db -c 'CREATE DATABASE primus_cafe;'
          psql -h localhost -U primus_user -d primus_db -c 'CREATE DATABASE primus_global;'

      - name: Run alembic upgrade head (core)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://primus_user:primus_pw@localhost:5432/primus_db
        run: alembic -c alembic.ini upgrade head

      - name: alembic check (core — no autogenerate drift)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://primus_user:primus_pw@localhost:5432/primus_db
        run: alembic -c alembic.ini check

      - name: Run alembic upgrade head (cafe)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://primus_user:primus_pw@localhost:5432/primus_cafe
        run: alembic -c alembic_cafe.ini upgrade head

      - name: alembic check (cafe)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://primus_user:primus_pw@localhost:5432/primus_cafe
        run: alembic -c alembic_cafe.ini check

      - name: Run alembic upgrade head (global)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://primus_user:primus_pw@localhost:5432/primus_global
        run: alembic -c alembic_global.ini upgrade head

      - name: alembic check (global)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://primus_user:primus_pw@localhost:5432/primus_global
        run: alembic -c alembic_global.ini check

  # ---------------------------------------------------------------------------
  # SBOM generation (SPDX) via syft
  # ---------------------------------------------------------------------------
  sbom:
    name: SBOM (SPDX)
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local tag)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.production
          push: false
          load: true
          tags: primus-backend:sbom
          cache-from: type=gha

      - name: Generate SPDX SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: primus-backend:sbom
          format: spdx-json
          output-file: primus-backend.spdx.json
          upload-artifact: true
          artifact-name: primus-backend-sbom
